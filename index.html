<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Der Weg des Magiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0417;
    --bg-violet: #1a0b2e;
    --bg-indigo: #0f0a2e;
    --neon-violet: #a855f7;
    --neon-purple: #c084fc;
    --neon-cyan: #22d3ee;
    --neon-pink: #ec4899;
    --text-soft: #e5e0f5;
    --text-dim: #9b91b8;
    --card-bg: rgba(26, 11, 46, 0.55);
    --card-border: rgba(168, 85, 247, 0.35);
    --glow-violet: 0 0 20px rgba(168, 85, 247, 0.6), 0 0 40px rgba(168, 85, 247, 0.3);
    --glow-cyan: 0 0 20px rgba(34, 211, 238, 0.6), 0 0 40px rgba(34, 211, 238, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    color: var(--text-soft);
    background: var(--bg-deep);
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ---------- ATMOSPHÄRISCHER HINTERGRUND ---------- */
  .cosmos {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(88, 28, 135, 0.55), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(30, 58, 138, 0.5), transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(76, 29, 149, 0.35), transparent 70%),
      linear-gradient(160deg, #0a0417 0%, #1a0b2e 45%, #0f0a2e 100%);
  }
  .stars, .stars2, .stars3 {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-repeat: repeat;
  }
  .stars {
    background-image:
      radial-gradient(1.2px 1.2px at 20px 30px, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 120px 80px, rgba(192,132,252,0.8), transparent),
      radial-gradient(1.4px 1.4px at 200px 150px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 300px 60px, rgba(34,211,238,0.8), transparent),
      radial-gradient(1px 1px at 380px 220px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.2px 1.2px at 90px 260px, rgba(236,72,153,0.7), transparent);
    background-size: 420px 320px;
    animation: drift 120s linear infinite;
    opacity: 0.8;
  }
  .stars2 {
    background-image:
      radial-gradient(1px 1px at 60px 40px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 180px 200px, rgba(192,132,252,0.6), transparent),
      radial-gradient(1.3px 1.3px at 280px 100px, rgba(255,255,255,0.7), transparent);
    background-size: 350px 280px;
    animation: drift 180s linear infinite reverse;
    opacity: 0.6;
  }
  .stars3 {
    background-image:
      radial-gradient(2px 2px at 150px 90px, rgba(168,85,247,0.9), transparent),
      radial-gradient(1.6px 1.6px at 320px 240px, rgba(34,211,238,0.7), transparent);
    background-size: 500px 400px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { background-position: 0 0; }
    to { background-position: 420px 320px; }
  }
  @keyframes twinkle {
    0% { opacity: 0.4; }
    100% { opacity: 1; }
  }

  .nebula {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 30% 40%, rgba(139, 92, 246, 0.15), transparent 40%),
      radial-gradient(circle at 70% 70%, rgba(34, 211, 238, 0.1), transparent 45%);
    animation: nebulaPulse 12s ease-in-out infinite alternate;
  }
  @keyframes nebulaPulse {
    0% { opacity: 0.7; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }

  /* ---------- APP LAYOUT ---------- */
  .app {
    position: relative;
    z-index: 2;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 20px 18px 30px;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .app::-webkit-scrollbar { display: none; }

  /* ---------- TOP BAR MIT MENÜ ---------- */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    position: relative;
    z-index: 5;
  }
  .menu-btn {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--neon-purple);
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    flex-shrink: 0;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .menu-btn:active { transform: scale(0.92); box-shadow: var(--glow-violet); }
  .top-title {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(192,132,252,0.5);
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(10,4,23,0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .sidebar-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 280px;
    max-width: 82%;
    z-index: 201;
    background: linear-gradient(160deg, rgba(26,11,46,0.98), rgba(10,4,23,0.98));
    border-right: 1.5px solid rgba(168,85,247,0.4);
    box-shadow: 4px 0 40px rgba(168,85,247,0.35);
    transform: translateX(-100%);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    overflow-y: auto;
  }
  .sidebar.show { transform: translateX(0); }
  .sidebar-header {
    padding: 0 22px 18px;
    border-bottom: 1px solid rgba(168,85,247,0.2);
    margin-bottom: 12px;
  }
  .sidebar-title {
    font-family: 'Cinzel', serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(192,132,252,0.6);
  }
  .sidebar-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 22px;
    cursor: pointer;
    transition: all 0.25s;
    border-left: 3px solid transparent;
    color: var(--text-soft);
    font-size: 14px;
    letter-spacing: 0.5px;
    background: transparent;
    border-top: none; border-right: none; border-bottom: none;
    width: 100%;
    text-align: left;
    font-family: 'Inter', sans-serif;
  }
  .sidebar-item .icon { font-size: 20px; }
  .sidebar-item:active {
    background: rgba(168,85,247,0.12);
    border-left-color: var(--neon-violet);
    color: #fff;
  }
  .sidebar-item.active {
    background: rgba(168,85,247,0.15);
    border-left-color: var(--neon-violet);
    color: var(--neon-purple);
    box-shadow: inset 0 0 20px rgba(168,85,247,0.1);
  }

  /* ---------- VIEWS ---------- */
  .view { display: none; animation: fadeIn 0.5s ease; }
  .view.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- PROFIL ---------- */
  .profile {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 0 20px rgba(168,85,247,0.08);
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .profile::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(168,85,247,0.12), transparent 60%);
    animation: rotate 20s linear infinite;
    pointer-events: none;
  }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4c1d95, #1e1b4b);
    border: 2px solid var(--neon-violet);
    box-shadow: var(--glow-violet);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .profile-info { position: relative; z-index: 1; flex: 1; }
  .profile-name {
    font-family: 'Cinzel', serif;
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    text-shadow: 0 0 12px rgba(192,132,252,0.6);
  }
  .profile-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .profile-meta span { display: flex; align-items: center; gap: 4px; }
  .badge-xp {
    background: rgba(168,85,247,0.2);
    border: 1px solid var(--neon-violet);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    color: var(--neon-purple);
    font-weight: 600;
  }

  /* ---------- BUCH-SYMBOL BUTTON ---------- */
  .book-btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 30px 0 20px;
  }
  .book-btn {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(192,132,252,0.25), rgba(26,11,46,0.9) 70%);
    border: 2px solid var(--neon-violet);
    box-shadow: 0 0 40px rgba(168,85,247,0.5), inset 0 0 40px rgba(168,85,247,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 60px;
    cursor: pointer;
    transition: all 0.35s;
    position: relative;
    animation: breatheBook 4s ease-in-out infinite;
  }
  @keyframes breatheBook {
    0%, 100% { box-shadow: 0 0 40px rgba(168,85,247,0.5), inset 0 0 40px rgba(168,85,247,0.15); }
    50% { box-shadow: 0 0 65px rgba(168,85,247,0.8), inset 0 0 60px rgba(168,85,247,0.25); }
  }
  .book-btn:active { transform: scale(0.94); }
  .book-btn-label {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--neon-purple);
    margin-top: 16px;
    text-shadow: 0 0 12px rgba(168,85,247,0.6);
  }

  /* ---------- SEKTION TITEL ---------- */
  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--neon-purple);
    text-align: center;
    margin: 24px 0 16px;
    text-shadow: 0 0 15px rgba(168,85,247,0.5);
    position: relative;
  }

  /* ---------- STUFEN (DAS MAGISCHE BUCH) ---------- */
  .stufen-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .stufe-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .stufe-card.unlocked {
    cursor: pointer;
    border-color: var(--neon-violet);
    box-shadow: 0 0 25px rgba(168,85,247,0.35), inset 0 0 20px rgba(168,85,247,0.06);
  }
  .stufe-card.unlocked:active { transform: scale(0.97); }
  .stufe-card.locked {
    opacity: 0.45;
    filter: grayscale(0.6);
  }
  .stufe-orb {
    width: 58px; height: 58px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent 60%), #1a0b2e;
    position: relative;
  }
  .stufe-orb.unlocked {
    border: 2px solid var(--neon-violet);
    box-shadow: 0 0 25px rgba(168,85,247,0.6);
  }
  .stufe-orb.locked {
    border: 2px solid rgba(155,145,184,0.4);
  }
  .stufe-info { flex: 1; }
  .stufe-name {
    font-family: 'Cinzel', serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }
  .stufe-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .stufe-arrow {
    color: var(--neon-violet);
    font-size: 20px;
    opacity: 0.7;
  }

  /* ---------- THEMEN (KÖRPER / GEIST / SEELE NEBENEINANDER) ---------- */
  .themes-row {
    display: flex;
    gap: 12px;
    margin-top: 10px;
  }
  .theme-mini {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 8px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }
  .theme-mini:active { transform: scale(0.95); }
  .theme-mini-orb {
    width: 60px; height: 60px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin-bottom: 10px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent 60%), #1a0b2e;
    position: relative;
  }
  .theme-mini-orb::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, var(--orb-color), transparent 40%, var(--orb-color));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .theme-mini-orb.koerper { --orb-color: #f97316; box-shadow: 0 0 20px rgba(249,115,22,0.5); }
  .theme-mini-orb.geist { --orb-color: #22d3ee; box-shadow: 0 0 20px rgba(34,211,238,0.5); }
  .theme-mini-orb.seele { --orb-color: #c084fc; box-shadow: 0 0 20px rgba(192,132,252,0.5); }
  .theme-mini-name {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }

  /* ---------- BUTTONS ---------- */
  .btn {
    display: block;
    width: 100%;
    padding: 16px 24px;
    background: linear-gradient(135deg, rgba(76,29,149,0.7), rgba(30,27,75,0.7));
    border: 1.5px solid var(--neon-violet);
    border-radius: 16px;
    color: #fff;
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 0 15px rgba(168,85,247,0.3), inset 0 0 15px rgba(168,85,247,0.08);
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .btn:active {
    transform: scale(0.97);
    box-shadow: 0 0 30px rgba(168,85,247,0.7), inset 0 0 20px rgba(168,85,247,0.2);
  }
  .btn.secondary {
    background: rgba(26,11,46,0.6);
    border-color: rgba(168,85,247,0.4);
    font-size: 13px;
    padding: 13px 20px;
    color: var(--text-soft);
  }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  /* ---------- QUEST-KARTEN ---------- */
  .quest-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    margin-bottom: 14px;
    transition: all 0.3s;
    position: relative;
  }
  .quest-card.active {
    box-shadow: 0 0 25px rgba(168,85,247,0.35), inset 0 0 20px rgba(168,85,247,0.06);
    border-color: var(--neon-violet);
  }
  .quest-card.locked {
    opacity: 0.45;
    filter: grayscale(0.5);
  }
  .quest-card.completed {
    border-color: rgba(74,222,128,0.5);
    box-shadow: 0 0 20px rgba(74,222,128,0.2);
  }
  .quest-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .quest-num {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--neon-purple);
    text-transform: uppercase;
  }
  .quest-status-icon { font-size: 18px; }
  .quest-title {
    font-family: 'Cinzel', serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .quest-desc {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-soft);
    opacity: 0.85;
  }
  .quest-tip {
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(34,211,238,0.08);
    border-left: 3px solid var(--neon-cyan);
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.5;
    color: #b8e8f0;
    font-style: italic;
  }

  /* ---------- HEADER MIT ZURÜCK ---------- */
  .view-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .back-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--neon-violet);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .back-btn:active { transform: scale(0.9); box-shadow: var(--glow-violet); }
  .view-title {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 0 15px rgba(192,132,252,0.5);
  }
  .view-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ---------- TIMER ---------- */
  .timer-display {
    text-align: center;
    margin: 30px 0;
  }
  .timer-ring {
    width: 220px; height: 220px;
    margin: 0 auto;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(26,11,46,0.9), rgba(10,4,23,0.9));
    border: 2px solid rgba(168,85,247,0.4);
    box-shadow: 0 0 40px rgba(168,85,247,0.4), inset 0 0 40px rgba(168,85,247,0.15);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 40px rgba(168,85,247,0.4), inset 0 0 40px rgba(168,85,247,0.15); }
    50% { box-shadow: 0 0 60px rgba(168,85,247,0.7), inset 0 0 60px rgba(168,85,247,0.25); }
  }
  .timer-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--neon-purple);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .timer-value {
    font-family: 'Cinzel', serif;
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 25px rgba(192,132,252,0.9);
    letter-spacing: 2px;
  }
  .timer-day {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* ---------- MAGISCHE KARTE (SEELE) ---------- */
  .magic-card { perspective: 1000px; margin: 20px 0; }
  .magic-card-inner {
    background: linear-gradient(145deg, rgba(45,17,80,0.9), rgba(20,10,45,0.95));
    border: 1.5px solid var(--neon-violet);
    border-radius: 22px;
    padding: 28px 22px;
    box-shadow: 0 0 35px rgba(168,85,247,0.5), inset 0 0 30px rgba(168,85,247,0.1);
    position: relative;
    overflow: hidden;
    animation: cardAppear 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes cardAppear {
    0% { opacity: 0; transform: rotateY(-90deg) scale(0.7); }
