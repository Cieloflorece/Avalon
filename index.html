<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Avalon">
  <meta name="description" content="Avalon – Weg des Magiers. Dein Weg durch Körper, Geist und Seele.">
  <title>Avalon – Weg des Magiers</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <style>
/* =====================================================================
   AVALON – DESIGN
   Körper = Grün · Geist = Gelb · Seele = Violett
   App-Shell: fester Viewport, Screens scrollen nur in sich selbst.
   ===================================================================== */

:root {
  --body: #1f9d55;  --body-soft: #e8f6ee;  --body-ink: #127040;  --body-on: #ffffff;
  --mind: #f2b705;  --mind-soft: #fff5d6;  --mind-ink: #7d5c00;  --mind-on: #1c1c1e;
  --soul: #8b5cf6;  --soul-soft: #f1ebff;  --soul-ink: #5b2fc4;  --soul-on: #ffffff;

  --frame: #e9e9e4;
  --bg: #f5f5f2;
  --surface: #ffffff;
  --surface-2: #f3f3f0;
  --text: #19191b;
  --muted: #7b7b80;
  --line: #e4e4df;
  --accent: #19191b;
  --accent-ink: #ffffff;
  --danger: #d23b3b;

  --ring: conic-gradient(from 200deg, var(--body), var(--mind), var(--soul), var(--body));
  --shadow-sm: 0 1px 2px rgba(20,20,30,.05), 0 2px 8px rgba(20,20,30,.04);
  --shadow: 0 1px 2px rgba(20,20,30,.05), 0 12px 32px rgba(20,20,30,.08);
  --shadow-lg: 0 24px 60px rgba(20,20,30,.18);

  --r-lg: 26px;
  --r: 18px;
  --r-sm: 12px;
  --tb-h: 64px;
  --maxw: 480px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --body-soft: #13301f; --body-ink: #78dea3;
  --mind-soft: #332a0b; --mind-ink: #ffd54a;
  --soul-soft: #261b42; --soul-ink: #c7adff;
  --frame: #050506; --bg: #111113; --surface: #1b1b1e; --surface-2: #26262a;
  --text: #f2f2f3; --muted: #9b9ba1; --line: #303035;
  --accent: #f2f2f3; --accent-ink: #111113;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --body-soft: #13301f; --body-ink: #78dea3;
    --mind-soft: #332a0b; --mind-ink: #ffd54a;
    --soul-soft: #261b42; --soul-ink: #c7adff;
    --frame: #050506; --bg: #111113; --surface: #1b1b1e; --surface-2: #26262a;
    --text: #f2f2f3; --muted: #9b9ba1; --line: #303035;
    --accent: #f2f2f3; --accent-ink: #111113;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}

.cat-body { --c: var(--body); --c-soft: var(--body-soft); --c-ink: var(--body-ink); --c-on: var(--body-on); }
.cat-mind { --c: var(--mind); --c-soft: var(--mind-soft); --c-ink: var(--mind-ink); --c-on: var(--mind-on); }
.cat-soul { --c: var(--soul); --c-soft: var(--soul-soft); --c-ink: var(--soul-ink); --c-on: var(--soul-on); }

/* ---------- Basis & App-Rahmen ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  position: fixed; inset: 0;
  background: var(--frame);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -.01em; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--soul); outline-offset: 2px; }

.app {
  position: relative;
  width: 100%; height: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  background: var(--bg);
  overflow: hidden;
}
@media (min-width: 560px) and (min-height: 640px) {
  body { display: grid; place-items: center; }
  .app {
    height: min(92vh, 880px);
    max-width: 420px;
    border-radius: 36px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow-lg);
    transform: translateZ(0); /* Overlays bleiben im Rahmen */
  }
}

/* ---------- Bühne & Screens ---------- */
.stage { position: absolute; inset: 0; }
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  overflow-x: hidden; overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: calc(18px + var(--sat)) 18px calc(24px + var(--sab));
  background: var(--bg);
}
.screen.with-tb { padding-top: calc(var(--tb-h) + var(--sat) + 14px); }

.enter-fwd  { animation: inFwd .42s var(--ease) both; box-shadow: -16px 0 40px rgba(0,0,0,.08); z-index: 2; }
.leave-fwd  { animation: outFwd .42s var(--ease) both; z-index: 1; }
.enter-back { animation: inBack .42s var(--ease) both; z-index: 1; }
.leave-back { animation: outBack .42s var(--ease) both; z-index: 2; box-shadow: -16px 0 40px rgba(0,0,0,.08); }
.enter-fade { animation: inFade .38s var(--ease) both; z-index: 2; }
.leave-fade { animation: outFade .22s ease both; z-index: 1; }
@keyframes inFwd   { from { transform: translateX(100%); } to { transform: none; } }
@keyframes outFwd  { to { transform: translateX(-26%); opacity: .5; } }
@keyframes inBack  { from { transform: translateX(-26%); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes outBack { to { transform: translateX(100%); } }
@keyframes inFade  { from { opacity: 0; transform: scale(.985) translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes outFade { to { opacity: 0; } }

/* ---------- Typo-Helfer ---------- */
.eyebrow {
  font-size: .7rem; font-weight: 750; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted);
}
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.center { text-align: center; }
.chev { color: var(--muted); font-size: 1.35rem; line-height: 1; flex: none; }
.grow { flex: 1; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 20px;
  border: 1.5px solid var(--line); border-radius: 999px;
  background: var(--surface); font-weight: 680; font-size: .95rem;
  transition: transform .14s ease, opacity .2s, background .2s, box-shadow .2s;
}
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .35; pointer-events: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: var(--shadow-sm); }
.btn.block { width: 100%; }
.btn.lg { min-height: 58px; font-size: 1.05rem; border-radius: 20px; }
.btn.cat-btn { background: var(--c); color: var(--c-on); border-color: transparent; }
.btn.soft { background: var(--c-soft); color: var(--c-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); background: transparent; border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: .86rem; }

.icon-btn {
  width: 42px; height: 42px; flex: none;
  display: grid; place-items: center;
  border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--surface); font-size: 1.1rem; line-height: 1;
  transition: transform .14s;
}
.icon-btn:active { transform: scale(.92); }
.icon-btn.round { border-radius: 50%; }
.burger { display: grid; gap: 4px; width: 18px; }
.burger i { display: block; height: 2px; border-radius: 2px; background: currentColor; }
.burger i:nth-child(2) { width: 70%; justify-self: end; }

/* ---------- Avatar ---------- */
.avatar {
  flex: none; display: grid; place-items: center;
  width: 40px; height: 40px; border-radius: 50%;
  font-size: 1.3rem; line-height: 1;
  border: 2.5px solid transparent;
  background: linear-gradient(var(--surface-2), var(--surface-2)) padding-box, var(--ring) border-box;
}
.avatar.xl { width: 96px; height: 96px; font-size: 3rem; border-width: 4px; }
.avatar.lg { width: 72px; height: 72px; font-size: 2.3rem; border-width: 3.5px; }

/* ---------- Top-Leiste ---------- */
.topbar {
  position: absolute; z-index: 20; top: 0; left: 0; right: 0;
  height: calc(var(--tb-h) + var(--sat));
  padding: var(--sat) 14px 0 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
  border-bottom: 1px solid var(--line);
  transform: translateY(-110%); opacity: 0; pointer-events: none;
  transition: transform .5s var(--ease), opacity .35s;
}
.app.chrome .topbar { transform: none; opacity: 1; pointer-events: auto; }
.tb-profile {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  padding: 4px 8px 4px 2px; border: 0; background: none; border-radius: 999px; text-align: left;
}
.tb-profile:active { background: var(--surface-2); }
.tb-text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tb-text strong { font-size: .98rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-lvl { display: flex; align-items: center; gap: 8px; font-size: .72rem; font-weight: 700; color: var(--muted); }
.mini-bar { width: 56px; height: 5px; border-radius: 9px; background: var(--line); overflow: hidden; }
.mini-bar span, .xpbar span {
  display: block; height: 100%; border-radius: 9px;
  background: linear-gradient(90deg, var(--body), var(--mind), var(--soul));
  transition: width .7s var(--ease);
}

/* ---------- Screen-Kopf (Zurück + Titel) ---------- */
.s-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.s-head h1 { font-size: 1.45rem; }
.s-head .titles { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* ---------- Karten ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 16px; box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 12px; }
.empty {
  text-align: center; color: var(--muted); padding: 32px 18px;
  border: 1.5px dashed var(--line); border-radius: var(--r);
}
.empty .big { display: block; font-size: 2.2rem; margin-bottom: 6px; }

/* ---------- Onboarding ---------- */
.screen-lang { gap: 22px; }
.screen-lang > :first-child, .screen-home > :first-child { margin-top: auto; }
.screen-lang > :last-child, .screen-home > :last-child { margin-bottom: auto; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.brand-mark {
  width: 84px; height: 84px; border-radius: 26px;
  display: grid; place-items: center; font-size: 2.6rem;
  border: 3px solid transparent;
  background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--ring) border-box;
  box-shadow: var(--shadow);
}
.brand h1 { font-size: 2rem; }
.choice-list { display: flex; flex-direction: column; gap: 10px; }
.choice {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 64px; padding: 14px 18px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r);
  font-weight: 650; text-align: left; box-shadow: var(--shadow-sm);
  transition: transform .14s, border-color .2s;
}
.choice:active { transform: scale(.98); }
.choice .grow { font-size: 1.02rem; }
.choice.is-selected { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.flag { font-size: 1.7rem; line-height: 1; }
.steps { display: flex; justify-content: center; gap: 6px; }
.steps span { width: 28px; height: 5px; border-radius: 9px; background: var(--line); }
.steps span.on { background: var(--c); }

.screen-setup { gap: 18px; }
.setup-hero { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 4px 0 2px; }
.setup-hero .avatar.xl { transition: transform .3s var(--ease); }
.setup-hero .avatar.xl.pop { animation: pop .4s var(--ease); }
@keyframes pop { 40% { transform: scale(1.12); } }
.setup-hero h1 { font-size: 1.5rem; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > .label { font-size: .8rem; font-weight: 750; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
input[type="text"], textarea {
  width: 100%; padding: 15px 16px;
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface); color: var(--text);
  font: inherit; font-size: 16px; resize: none;
  transition: border-color .2s, box-shadow .2s;
}
input[type="text"]:focus, textarea:focus { border-color: var(--text); box-shadow: 0 0 0 4px var(--surface-2); }
.avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.avatar-opt {
  aspect-ratio: 1; font-size: 1.6rem; line-height: 1;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface);
  transition: transform .14s, border-color .2s, background .2s;
}
.avatar-opt:active { transform: scale(.9); }
.avatar-opt.is-selected { border-color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--text); }
.sticky-foot {
  position: sticky; bottom: 0;
  margin: auto -18px calc(-24px - var(--sab));
  padding: 14px 18px calc(18px + var(--sab));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}

/* ---------- Visitenkarte (Hauptseite) ---------- */
.screen-home { gap: 16px; }
.id-card {
  position: relative;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 30px; padding: 22px 20px 20px; box-shadow: var(--shadow);
  transform-origin: 50% 0;
  transition: transform .45s var(--ease), opacity .4s, border-radius .45s;
}
.id-card::before {
  content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 4px;
  border-radius: 0 0 6px 6px;
  background: linear-gradient(90deg, var(--body), var(--mind), var(--soul));
}
.id-card.collapsing { transform: translateY(-38%) scale(.92, .22); opacity: 0; }
.home-cta { transition: transform .4s var(--ease), opacity .3s; }
.home-cta.collapsing { transform: translateY(30px); opacity: 0; }
.id-top { display: flex; align-items: center; justify-content: space-between; }
.id-main { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin: 10px 0 18px; }
.id-main .avatar { margin-bottom: 6px; }
.id-name { font-size: 1.55rem; overflow-wrap: anywhere; }
.lvl-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 99px;
  background: var(--surface-2); font-size: .82rem; font-weight: 750;
}
.lvl-chip b { color: var(--muted); font-weight: 650; }
.xpbar { width: 70%; height: 8px; border-radius: 9px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.xp-note { font-size: .74rem; color: var(--muted); font-weight: 600; }
.cur-list { display: flex; flex-direction: column; gap: 8px; }
.cur {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 11px 12px; border: 0; text-align: left;
  background: var(--c-soft); border-radius: 16px;
  transition: transform .14s;
}
.cur:active { transform: scale(.98); }
.cur-dot {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: grid; place-items: center; font-size: 1.15rem;
  background: var(--c);
}
.cur-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.cur-text small { color: var(--c-ink); font-weight: 800; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; }
.cur-text strong { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cur-text strong.none { color: var(--muted); font-weight: 550; }
.cta-book { gap: 10px; }
.cta-book .ico { font-size: 1.3rem; }

/* ---------- Buch: Welten-Karussell ---------- */
.screen-book { padding-left: 0; padding-right: 0; padding-bottom: calc(10px + var(--sab)); overflow: hidden; }
.tabs {
  display: flex; gap: 4px; padding: 4px; margin: 0 18px;
  background: var(--surface-2); border-radius: 16px; flex: none;
}
.tab {
  flex: 1; min-width: 0; border: 0; background: none;
  padding: 8px 4px; border-radius: 12px;
  font-size: .78rem; font-weight: 700; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .25s, color .25s, box-shadow .25s;
}
.tab.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.carousel {
  flex: 1; min-height: 0;
  display: flex; gap: 12px;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  padding: 14px 7%;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.carousel::-webkit-scrollbar { display: none; }
.wcard {
  flex: 0 0 86%; min-width: 0;
  scroll-snap-align: center; scroll-snap-stop: always;
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 28px; box-shadow: var(--shadow);
  overflow: hidden;
  transform: scale(.94); opacity: .55;
  transition: transform .35s var(--ease), opacity .35s;
}
.wcard.is-active { transform: none; opacity: 1; }
.wcard-head { padding: 18px 18px 14px; text-align: center; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.w-icon {
  width: 52px; height: 52px; border-radius: 16px;
  display: grid; place-items: center; font-size: 1.6rem;
  border: 2.5px solid transparent;
  background: linear-gradient(var(--surface-2), var(--surface-2)) padding-box, var(--ring) border-box;
}
.wcard.is-locked .w-icon { background: var(--surface-2); border-color: var(--line); filter: grayscale(1); }
.w-title { font-size: 1.15rem; }
.w-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 99px; background: var(--surface-2);
  font-size: .74rem; font-weight: 700; color: var(--muted);
}
.path-wrap { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.path-wrap::-webkit-scrollbar { display: none; }
.path { position: relative; margin: 6px 0; }
.path svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.path path { fill: none; stroke: var(--line); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; }
.node {
  position: absolute; transform: translate(-50%, -32px);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.lvl {
  position: relative; width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 1.4rem; font-weight: 800;
  background: var(--surface-2); color: var(--muted);
  border: 2px solid var(--line);
  transition: transform .15s;
}
.lvl:active { transform: scale(.9); }
.lvl .lock { font-size: 1.15rem; filter: grayscale(1); opacity: .65; }
.lvl.open {
  color: var(--text); border: 4px solid transparent;
  background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--ring) border-box;
  box-shadow: var(--shadow);
}
.lvl.open::before {
  content: ""; position: absolute; inset: -9px; border-radius: 50%;
  border: 2px solid var(--soul); opacity: 0;
  animation: ripple 2.4s ease-out infinite;
}
@keyframes ripple { 0% { transform: scale(.85); opacity: .5; } 100% { transform: scale(1.25); opacity: 0; } }
.lvl.done { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lvl.done::before { display: none; }
.node-cap { font-size: .7rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.node-cap.go { color: var(--text); }
.book-foot { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 2px 18px 0; }
.dots { display: flex; gap: 7px; }
.dots i { width: 7px; height: 7px; border-radius: 9px; background: var(--line); transition: width .3s var(--ease), background .3s; }
.dots i.on { width: 22px; background: var(--text); }
.hint { font-size: .74rem; color: var(--muted); font-weight: 600; }

/* ---------- Stufe: drei Bereiche ---------- */
.lvl-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.lvl-badge {

        missions: (s.missions && typeof s.missions === 'object') ? s.missions : {},

  const $ = (s, r) => (r || document).querySelector(s);

  function t(key, vars) {

    let s = d[key] != null ? d[key] : (I18N.de[key] != null ? I18N.de[key] : key);
    if (vars) Object.keys(vars).forEach(k => { s = String(s).split('{' + k + '}').join(vars[k]); });

  }
  const L = o => (o ? (o[state.lang] || o.de || '') : '');

  const fmtDateTime = ts => new Date(ts).toLocaleString(locale(), { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const levelOf = xp => Math.floor((Number(xp) || 0) / XP_PER_LEVEL) + 1;
  const xpPct = () => (state.xp % XP_PER_LEVEL) / XP_PER_LEVEL * 100;

  const missionsOf = (w, n, cat) => ((C.missions[w + '-' + n] || {})[cat]) || [];

    el.className = `screen screen-${res.key}` + (res.chrome && !res.noPad ? ' with-tb' : '');

    if (th === 'light' || th === 'dark') root.dataset.theme = th; else delete root.dataset.theme;
    const meta = $('meta[name="theme-color"]');
    const bg = getComputedStyle(root).getPropertyValue('--bg').trim();
    if (meta && bg) meta.setAttribute('content', bg);
  }

  /* ------------------------------------------------------------------
     OVERLAYS (Seitenleiste, Bottom-Sheet, Modal)
     Jedes Overlay legt einen History-Eintrag an → Zurück-Taste schließt es.
     ------------------------------------------------------------------ */
  let openLayer = null;
  let afterClose = null;

  function showLayer(name) {
    if (openLayer && openLayer !== name) { hideLayer(openLayer); history.replaceState({ ov: name }, ''); }
    else if (!openLayer) history.pushState({ ov: name }, '');
    openLayer = name;
    layers[name].classList.add('open');
    layers[name].setAttribute('aria-hidden', 'false');
  }
  function hideLayer(name) {
    layers[name].classList.remove('open');
    layers[name].setAttribute('aria-hidden', 'true');
    if (name === 'sheet') sheetId = null;
  }
  function closeOverlay(then) {
    if (!openLayer) { if (then) then(); return; }
    afterClose = then || null;
    history.back();
  }
  window.addEventListener('popstate', () => {
    if (!openLayer) return;
    hideLayer(openLayer);
    openLayer = null;
    if (afterClose) { const f = afterClose; afterClose = null; setTimeout(f, 30); }
  });

  /* Seitenleiste */
  function renderMenu() {

        <p class="sb-sec">${esc(t('books'))}</p>
        ${books.map(w => item('#/book/' + w.id, w.icon || '📘', L(w.title))).join('')}
        <p class="sb-sec">${esc(t('settings'))}</p>

  /* Bottom-Sheet: Missionsdetails */
  let sheetId = null;
  function openSheet(id) {
    if (!MISSIONS[id]) return;
    sheetId = id;
    renderSheet();
    showLayer('sheet');
  }
  function renderSheet() {
    const info = MISSIONS[sheetId];
    if (!info) return;
    const { m, level, cat } = info;
    const st = statusOf(sheetId), rec = state.missions[sheetId];
    let foot;
    if (st === 'open') foot = `<button class="btn cat-btn lg block" data-action="accept" data-id="${esc(sheetId)}">${esc(t('acceptMission'))}</button>`;
    else if (st === 'active') foot = `<p class="note">${esc(t('acceptedOn', { d: fmtDate(rec.acceptedAt) }))}</p>
      <button class="btn cat-btn lg block" data-action="complete" data-id="${esc(sheetId)}">✓ ${esc(t('completeMission'))}</button>`;
    else foot = `<div class="done-banner">✓ ${esc(t('doneOn', { d: fmtDate(rec.doneAt) }))}</div>`;
    const stLabel = st === 'done' ? t('statusDone') : st === 'active' ? t('statusActive') : t('statusOpen');
    const sheet = $('#sheet');
    sheet.className = 'sheet cat-' + cat;
    sheet.innerHTML = `
      <div class="grab" id="grab"><span></span></div>
      <div class="sheet-body">
        <div class="sh-top">
          <span class="sh-chip">${CAT_ICON[cat]} ${esc(t(cat))}</span>
          <button class="icon-btn round" data-action="close-overlay" aria-label="${esc(t('close'))}">✕</button>
        </div>
        <h2 class="sh-title">${esc(L(m.title))}</h2>
        <div class="sh-meta">
          <span class="tag">${esc(t('levelN', { n: level }))}</span>

        </div>
        <div class="prose">${paras(L(m.text))}</div>
      </div>
      <div class="sheet-foot">${foot}</div>`;
    initSheetDrag();
  }
  function initSheetDrag() {
    const grab = $('#grab'), sheet = $('#sheet');
    if (!grab) return;
    let y0 = null, dy = 0;
    grab.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sheet.classList.add('dragging'); }, { passive: true });
    grab.addEventListener('touchmove', e => {
      if (y0 === null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      sheet.style.transform = `translateY(${dy}px)`;
    }, { passive: true });
    const end = () => {
      if (y0 === null) return;
      sheet.classList.remove('dragging');
      sheet.style.transform = '';
      if (dy > 90) closeOverlay();
      y0 = null;
    };
    grab.addEventListener('touchend', end);
    grab.addEventListener('touchcancel', end);
  }

  /* ------------------------------------------------------------------
     BUCH – Welten-Karussell (Scroll-Snap)
     ------------------------------------------------------------------ */
  const ROW_H = 92;
  const XS = [50, 76, 50, 24];

  function viewBook(id) {
    let i = WORLDS.findIndex(w => w.id === id);
    if (i < 0) i = Math.max(0, WORLDS.findIndex(w => w.id === C.startWorld));
    worldIdx = i;
    return `
      <div class="tabs" role="tablist">
        ${WORLDS.map((w, k) => `<button class="tab ${k === i ? 'on' : ''}" role="tab" data-action="world-goto" data-idx="${k}">${w.icon || ''} ${esc(L(w.tab) || L(w.title))}</button>`).join('')}
      </div>
      <div class="carousel" id="carousel">${WORLDS.map(worldCard).join('')}</div>
      <div class="book-foot">
        <div class="dots">${WORLDS.map((w, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
        <span class="hint">${esc(t('swipeHint'))}</span>
      </div>`;
  }

  function worldCard(w, k) {
    const open = w.unlocked || [];
    const locked = open.length === 0;
    const n = w.levels;
    const H = n * ROW_H;
    const pts = [];
    for (let i = 0; i < n; i++) pts.push([XS[i % XS.length], ROW_H / 2 + i * ROW_H]);
    let d = `M ${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      d += ` C ${x0} ${y0 + ROW_H / 2}, ${x1} ${y1 - ROW_H / 2}, ${x1} ${y1}`;
    }
    const nodes = pts.map(([x, y], i) => {
      const lv = i + 1, isOpen = open.includes(lv), done = isOpen && levelDone(w.id, lv);
      const label = t('levelN', { n: lv }) + (isOpen ? '' : ' – ' + t('lockedShort'));
      return `<div class="node" style="left:${x}%;top:${y}px">
        <button class="lvl ${isOpen ? 'open' : 'locked'} ${done ? 'done' : ''}" ${isOpen ? `data-action="open-level" data-world="${w.id}" data-level="${lv}"` : 'data-action="locked"'} aria-label="${esc(label)}">
          ${done ? '✓' : isOpen ? lv : '<span class="lock">🔒</span>'}</button>
        <span class="node-cap ${isOpen && !done ? 'go' : ''}">${isOpen && !done ? '▶ ' + esc(t('start')) : esc(t('levelN', { n: lv }))}</span>
      </div>`;
    }).join('');
    return `
      <article class="wcard ${locked ? 'is-locked' : ''} ${k === worldIdx ? 'is-active' : ''}" data-idx="${k}">
        <header class="wcard-head">
          <div class="w-icon">${w.icon || '📘'}</div>
          <span class="eyebrow">${esc(t('worldOf', { i: k + 1, n: WORLDS.length }))}</span>
          <h2 class="w-title">${esc(L(w.title))}</h2>
          <span class="w-badge">${locked ? '🔒 ' + esc(t('soon')) : esc(t('levelsOpen', { o: open.length, n }))}</span>
        </header>
        <div class="path-wrap">
          <div class="path" style="height:${H}px">
            <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>
            ${nodes}
          </div>
        </div>
      </article>`;
  }

  function cardLeft(car, idx) {
    const card = car.children[idx];
    return card ? card.offsetLeft - (car.clientWidth - card.offsetWidth) / 2 : 0;
  }

  function markWorld(idx) {
    worldIdx = idx;
    const scr = current.el;
    if (!scr) return;
    $$('.tab', scr).forEach((b, k) => b.classList.toggle('on', k === idx));
    $$('.dots i', scr).forEach((b, k) => b.classList.toggle('on', k === idx));
    $$('.wcard', scr).forEach((c, k) => c.classList.toggle('is-active', k === idx));
    const h = '#/book/' + WORLDS[idx].id;
    if (location.hash !== h) { history.replaceState(history.state, '', h); current.hash = h; }
    renderMenu();
  }

  function scrollToWorld(idx, smooth) {
    const car = current.el && $('#carousel', current.el);
    if (!car) return;
    idx = Math.max(0, Math.min(WORLDS.length - 1, idx));
    car.scrollTo({ left: cardLeft(car, idx), behavior: smooth && !reduced() ? 'smooth' : 'auto' });
    markWorld(idx);
  }

  function initBook(scr) {
    const car = $('#carousel', scr);
    if (!car) return;
    const place = () => { car.scrollLeft = cardLeft(car, worldIdx); };
    place();
    requestAnimationFrame(place);
    let raf = null;
    car.addEventListener('scroll', () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const mid = car.scrollLeft + car.clientWidth / 2;
        let best = 0, bestDist = Infinity;
        Array.from(car.children).forEach((c, k) => {
          const dist = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
          if (dist < bestDist) { bestDist = dist; best = k; }
        });
        if (best !== worldIdx) markWorld(best);
      });
    }, { passive: true });
  }

  /* ------------------------------------------------------------------
     MISSIONEN
     ------------------------------------------------------------------ */
  function missionCard(m) {
    const st = statusOf(m.id);
    let action;
    if (st === 'done') action = `<span class="done-txt">✓ ${esc(t('completed'))}</span>`;

  function viewMissions(w, n, cat) {

      <div class="cat-${cat}">

        </div>

          ${CATS.map(c => `<button class="cat-${c} ${c === cat ? 'on' : ''}" data-action="switch-cat" data-to="#/missions/${w}/${n}/${c}">${CAT_ICON[c]} ${esc(t(c))}</button>`).join('')}

          : `<div style="padding:16px 18px"><p class="empty">${esc(t('noMissions'))}</p></div>`}
      </div>`;
  }

  function accept(id) {
    if (!MISSIONS[id] || statusOf(id) !== 'open') return;
    state.missions[id] = { status: 'active', acceptedAt: Date.now() };
    save(); buzz(15);
    render();
    if (sheetId === id) renderSheet();
    toast('✨ ' + t('acceptedToast'));
  }

  function complete(id) {
    const info = MISSIONS[id];
    if (!info || statusOf(id) !== 'active') return;
    const before = levelOf(state.xp);
    state.missions[id].status = 'done';
    state.missions[id].doneAt = Date.now();
    state.xp += Number(info.m.xp) || 0;
    save(); buzz([15, 40, 15]);
    render();
    if (sheetId === id) renderSheet();
    const after = levelOf(state.xp);
    if (after > before) closeOverlay(() => openModal(t('levelUpTitle', { n: after }), t('levelUpText'), t('ok'), '🏆'));
    else toast('🎉 ' + t('completedToast', { xp: Number(info.m.xp) || 0 }));
  }

  function viewPage(key) {
    const P = {
      character: pageCharacter, logbook: pageLogbook, diary: pageDiary,

      group: () => pagePh('group', '👥'), mentor: () => pagePh('mentor', '🧭'), help: pageHelp
    };
    return P[key] ? P[key]() : shell('notFound', '🧭', `<div class="card ph"><p class="muted">${esc(t('notFound'))}</p></div>`);
  }

  function pageCharacter() {
    draft = { name: state.name, avatar: state.avatar };
    const recs = Object.values(state.missions);
    return shell('character', '🪪', `
      <div class="card stats">
        <div><strong>${levelOf(state.xp)}</strong><small>${esc(t('level'))}</small></div>
        <div><strong>${state.xp}</strong><small>XP</small></div>
        <div><strong>${recs.filter(r => r.status === 'active').length}</strong><small>${esc(t('statusActive'))}</small></div>
        <div><strong>${recs.filter(r => r.status === 'done').length}</strong><small>${esc(t('statusDone'))}</small></div>
      </div>
      <form id="charForm" class="card stack" novalidate autocomplete="off">
        <div class="setup-hero" style="padding:0"><div class="avatar xl" id="avPreview">${esc(draft.avatar)}</div></div>
        <label class="field"><span class="label">${esc(t('yourName'))}</span>
          <input id="nameInput" type="text" maxlength="24" value="${esc(draft.name)}"></label>
        <div class="field"><span class="label">${esc(t('chooseAvatar'))}</span>${avatarGrid(draft.avatar)}</div>
        <button class="btn primary block" type="submit">${esc(t('save'))}</button>
      </form>
      <div style="margin-top:16px"><button class="btn danger block" data-action="reset">${esc(t('reset'))}</button></div>`);
  }

  function pageLogbook() {
    const ids = Object.keys(state.missions).filter(id => MISSIONS[id]);
    const last = id => state.missions[id].doneAt || state.missions[id].acceptedAt || 0;
    ids.sort((a, b) => last(b) - last(a));
    if (!ids.length) return shell('logbook', '📜', `<div class="empty"><span class="big">📜</span>${esc(t('logEmpty'))}</div>`);
    const act = ids.filter(id => statusOf(id) === 'active').length, done = ids.filter(id => statusOf(id) === 'done').length;
    return shell('logbook', '📜', `
      <p class="muted small" style="margin-bottom:12px">${esc(t('logSummary', { a: act, d: done, xp: state.xp }))}</p>
      <div class="list">${ids.map(id => {
        const { m, cat } = MISSIONS[id], r = state.missions[id];
        const line = r.status === 'done' ? t('doneOn', { d: fmtDate(r.doneAt) }) : t('acceptedOn', { d: fmtDate(r.acceptedAt) });
        return `<button class="row cat-${cat}" data-action="open-mission" data-id="${esc(id)}">
          <span class="dot"></span>
          <span class="titles"><strong>${esc(L(m.title))}</strong><small>${esc(t(cat))} · ${esc(line)}</small></span>
          <span>${r.status === 'done' ? '✅' : '⏳'}</span></button>`;
      }).join('')}</div>`);
  }

  function pageDiary() {
    const entries = state.diary.slice().sort((a, b) => b.ts - a.ts);
    return shell('diary', '✍️', `
      <form id="diaryForm" class="card stack">
        <textarea id="diaryText" rows="4" maxlength="4000" placeholder="${esc(t('diaryPh'))}"></textarea>
        <button class="btn primary block" type="submit">${esc(t('addEntry'))}</button>
      </form>
      <div style="margin-top:12px">
        ${entries.length ? entries.map(e => `
          <div class="card">
            <div class="entry-head"><small>${esc(fmtDateTime(e.ts))}</small>
              <button class="link danger" data-action="diary-del" data-id="${esc(e.id)}">${esc(t('delete'))}</button></div>
            <div class="prose">${paras(e.text)}</div>
          </div>`).join('') : `<div class="empty"><span class="big">📓</span>${esc(t('diaryEmpty'))}</div>`}
      </div>`);
  }

  function pageNotifications() {
    const sup = 'Notification' in window;
    const perm = sup ? Notification.permission : 'unsupported';
    const note = !sup ? t('notifUnsupported') : perm === 'denied' ? t('notifDenied') : '';
    const canTest = sup && perm === 'granted' && state.settings.notifications;
    return shell('notifications', '🔔', `
      <div class="card">
        <label class="row-switch">
          <span><strong>${esc(t('notifReminders'))}</strong><small>${esc(t('notifText'))}</small></span>
          <input type="checkbox" class="switch" data-action="toggle-notif" ${state.settings.notifications ? 'checked' : ''}>
        </label>
        ${note ? `<p class="note" style="margin-top:12px">${esc(note)}</p>` : ''}
        ${canTest ? `<div style="margin-top:14px"><button class="btn block" data-action="notif-test">${esc(t('notifTest'))}</button></div>` : ''}
      </div>`);
  }

  function toggleNotif(el) {
    const want = el.checked;
    if (want && 'Notification' in window && Notification.permission !== 'granted') {
      let handled = false;
      const handle = p => {
        if (handled) return; handled = true;
        state.settings.notifications = p === 'granted'; save(); render();
        if (p !== 'granted') toast(t('notifDenied'));
      };
      try {
        const r = Notification.requestPermission(handle);
        if (r && typeof r.then === 'function') r.then(handle, () => handle('denied'));
      } catch (e) { handle('denied'); }
      return;
    }
    state.settings.notifications = want; save(); render();
  }

  function pageDesign() {
    const th = state.settings.theme;
    const opt = (id, icon, label) => `<button class="choice ${th === id ? 'is-selected' : ''}" data-action="set-theme" data-theme="${id}">
      <span class="flag">${icon}</span><span class="grow">${esc(label)}</span><span class="chev">${th === id ? '✓' : ''}</span></button>`;
    return shell('design', '🎨', `
      <div class="choice-list">${opt('light', '☀️', t('themeLight'))}${opt('dark', '🌙', t('themeDark'))}${opt('system', '📱', t('themeSystem'))}</div>
      <p class="eyebrow" style="margin:22px 0 10px">${esc(t('colorLegend'))}</p>
      <div class="legend">${CATS.map(c => `<div class="cat-${c}"><i></i>${esc(t(c))}</div>`).join('')}</div>`);
  }

  function pageLanguage() {
    return shell('language', '🌐', `<div class="choice-list">${LANGS.map(l => `
      <button class="choice ${state.lang === l.id ? 'is-selected' : ''}" data-action="change-lang" data-lang="${l.id}">
        <span class="flag">${l.flag}</span><span class="grow">${l.label}</span><span class="chev">${state.lang === l.id ? '✓' : ''}</span></button>`).join('')}</div>`);
  }

  function pageMonthplan() {
    const now = new Date();
    const ref = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
    const y = ref.getFullYear(), mo = ref.getMonth();
    const days = new Date(y, mo + 1, 0).getDate();
    const lead = (ref.getDay() + 6) % 7;
    const act = new Set();
    const mark = ts => { if (!ts) return; const d = new Date(ts); if (d.getFullYear() === y && d.getMonth() === mo) act.add(d.getDate()); };
    Object.values(state.missions).forEach(r => { mark(r.acceptedAt); mark(r.doneAt); });
    state.diary.forEach(e => mark(e.ts));
    let cells = (I18N[state.lang] || I18N.de).wd.map(w => `<div class="wd">${esc(w)}</div>`).join('');
    for (let i = 0; i < lead; i++) cells += '<div></div>';
    for (let d = 1; d <= days; d++) cells += `<div class="d ${monthOffset === 0 && d === now.getDate() ? 'today' : ''} ${act.has(d) ? 'act' : ''}">${d}</div>`;
    return shell('monthplan', '🗓️', `
      <div class="card">
        <div class="cal-head">
          <button class="icon-btn round" data-action="month" data-dir="-1">‹</button>
          <strong>${esc(ref.toLocaleDateString(locale(), { month: 'long', year: 'numeric' }))}</strong>
          <button class="icon-btn round" data-action="month" data-dir="1">›</button>
        </div>
        <div class="cal">${cells}</div>
        <div class="cal-legend"><i></i>${esc(t('monthLegend'))}</div>
      </div>
      <div class="card ph"><div class="big">🎯</div><p class="muted">${esc(t('monthPlaceholder'))}</p></div>`);
  }

  function pagePh(key, icon) {
    return shell(key, icon, `<div class="card ph"><div class="big">${icon}</div>
      <p><strong>${esc(t(key + 'Text'))}</strong></p><p class="muted small">${esc(t('placeholder'))}</p></div>`);
  }

  function pageHelp() {
    return shell('help', '❓', `
      <p class="eyebrow" style="margin-bottom:10px">${esc(t('helpText'))}</p>
      ${[1, 2, 3].map(i => `<details class="card"><summary>${esc(t('faq' + i + 'q'))}</summary><p>${esc(t('faq' + i + 'a'))}</p></details>`).join('')}`);
  }

  /* ------------------------------------------------------------------
     AKTIONEN
     ------------------------------------------------------------------ */
  function act(action, el) {
    switch (action) {
      case 'set-lang': state.lang = el.dataset.lang; save(); go('#/setup', 'fwd'); break;
      case 'pick-avatar': {
        draft.avatar = el.dataset.avatar;
        $$('.avatar-opt', el.parentElement).forEach(b => { const on = b === el; b.classList.toggle('is-selected', on); b.setAttribute('aria-checked', String(on)); });
        const pv = $('#avPreview');
        if (pv) { pv.textContent = draft.avatar; pv.classList.remove('pop'); void pv.offsetWidth; pv.classList.add('pop'); }
        const btn = $('#setupBtn'); if (btn) btn.disabled = !draftValid();
        buzz(8);
        break;
      }
      case 'back-to': go(el.dataset.to, 'back'); break;
      case 'page-back': goBack('#/book/' + C.startWorld); break;
      case 'go-home': go('#/home', 'fade'); break;
      case 'open-book': openBook(); break;
      case 'menu': showLayer('menu'); break;
      case 'close-overlay': closeOverlay(); break;
      case 'world-goto': scrollToWorld(parseInt(el.dataset.idx, 10) || 0, true); break;
      case 'locked': toast('🔒 ' + t('locked')); buzz(25); break;
      case 'open-level': go(`#/level/${el.dataset.world}/${el.dataset.level}`, 'fwd'); break;
      case 'open-cat': go(el.dataset.to, 'fwd'); break;
      case 'switch-cat': go(el.dataset.to, 'fade'); break;
      case 'home-mission': {
        const id = el.dataset.id;
        const target = id ? `#/missions/${MISSIONS[id].world}/${MISSIONS[id].level}/${el.dataset.cat}` : `#/missions/${C.startWorld}/1/${el.dataset.cat}`;
        if (id) pendingSheet = id;
        $app.classList.add('chrome');
        go(target, 'fwd');
        break;
      }
      case 'open-mission': openSheet(el.dataset.id); break;
      case 'accept': accept(el.dataset.id); break;
      case 'complete': complete(el.dataset.id); break;
      case 'reset':
        if (confirm(t('resetConfirm'))) {
          try { localStorage.removeItem(STORE_KEY); } catch (e) { /* egal */ }
          state = defaults(); draft = { name: '', avatar: '' }; navCount = 0;
          go('#/lang', 'fade');
        }
        break;
      case 'diary-del':
        if (confirm(t('deleteConfirm'))) { state.diary = state.diary.filter(e => e.id !== el.dataset.id); save(); render(); }
        break;
      case 'toggle-notif': toggleNotif(el); break;
      case 'notif-test':
        try { new Notification('Avalon', { body: t('notifTestBody') }); } catch (e) { toast(t('notifUnsupported')); }
        break;
      case 'set-theme': state.settings.theme = el.dataset.theme; save(); render(); break;
      case 'change-lang': state.lang = el.dataset.lang; save(); render(); toast('✓ ' + t('saved')); break;
      case 'month': monthOffset += parseInt(el.dataset.dir, 10) || 0; render(); break;
    }
  }

  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { e.preventDefault(); const h = nav.dataset.nav; closeOverlay(() => go(h)); return; }
    const el = e.target.closest('[data-action]');
    if (el) act(el.dataset.action, el);
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'setupForm') submitSetup();
    else if (e.target.id === 'charForm') {
      if (!draftValid()) { toast(t('nameRequired')); return; }
      state.name = draft.name.trim().slice(0, 24); state.avatar = draft.avatar;
      save(); render(); toast('✓ ' + t('saved'));
    } else if (e.target.id === 'diaryForm') {
      const v = ($('#diaryText').value || '').trim();
      if (!v) return;
      state.diary.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), text: v });
      save(); render(); toast('✓ ' + t('saved'));
    }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'nameInput') {
      draft.name = e.target.value;
      const btn = $('#setupBtn'); if (btn) btn.disabled = !draftValid();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && openLayer) { closeOverlay(); return; }
    if (openLayer || current.key !== 'book' || /INPUT|TEXTAREA/.test(e.target.tagName || '')) return;
    if (e.key === 'ArrowLeft') scrollToWorld(worldIdx - 1, true);
    if (e.key === 'ArrowRight') scrollToWorld(worldIdx + 1, true);
  });
  window.addEventListener('hashchange', () => {
    navCount++;
    if (openLayer) { hideLayer(openLayer); openLayer = null; }
    render();
  });

  /* Start */
  render();
})();

  </script>
</body>
</html>
