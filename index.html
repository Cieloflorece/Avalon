<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Avalon – Weg des Magiers. Dein Weg durch Körper, Geist und Seele.">
  <title>Avalon – Weg des Magiers</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Sicherheitsnetz: Zeigt einen Fehler sichtbar an, statt einen leeren Bildschirm. */
    window.avalonShowError = function (msg) {
      var box = document.getElementById('avalon-error');
      if (!box) {
        box = document.createElement('div');
        box.id = 'avalon-error';
        box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:14px 16px;border-radius:14px;background:#d23b3b;color:#fff;font:14px/1.4 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.25)';
        (document.body || document.documentElement).appendChild(box);
      }
      box.textContent = '⚠️ Avalon konnte nicht vollständig starten: ' + msg;
    };
    window.addEventListener('error', function (e) {
      window.avalonShowError(e && e.message ? e.message : 'Unbekannter Fehler');
    });
  </script>
</head>
<body>
  <div class="app">
    <!-- Schmale Top-Leiste (erscheint ab der Level-Ansicht) -->
    <header class="topbar" id="topbar" hidden>
      <button class="tb-profile" data-go="#/home" aria-label="Spielerprofil">
        <span class="avatar" id="tbAvatar"></span>
        <span class="tb-text">
          <strong id="tbName"></strong>
          <small id="tbLevel"></small>
        </span>
      </button>
      <button class="icon-btn" data-action="menu" aria-label="Menü">
        <span class="burger"><i></i><i></i><i></i></span>
      </button>
    </header>

    <!-- Hier werden alle Ansichten per JavaScript gerendert.
         Die Sprachauswahl steht bereits im HTML, damit nie ein leerer Bildschirm erscheint. -->
    <main class="view" id="view">
      <section class="onb">
        <div class="stepper"><span class="cat-body on"></span><span class="cat-mind"></span><span class="cat-soul"></span></div>
        <div class="onb-mark">📖</div>
        <h1 class="onb-title">Avalon</h1>
        <p class="muted">Sprache · Language · Idioma</p>
        <div class="stack">
          <button class="choice" data-action="set-lang" data-lang="de"><span class="flag">🇩🇪</span><span>Deutsch</span><span class="chev">›</span></button>
          <button class="choice" data-action="set-lang" data-lang="en"><span class="flag">🇬🇧</span><span>English</span><span class="chev">›</span></button>
          <button class="choice" data-action="set-lang" data-lang="es"><span class="flag">🇪🇸</span><span>Español</span><span class="chev">›</span></button>
        </div>
      </section>
    </main>
  </div>

  <!-- Seitenmenü -->
  <div class="scrim" id="scrim" data-action="close-menu"></div>
  <aside class="sidebar" id="sidebar" aria-hidden="true"></aside>

  <!-- Dialog / Sprechblase -->
  <div class="dialog-backdrop" id="dialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="bubble">
        <h2 id="dialogTitle"></h2>
        <p id="dialogText"></p>
      </div>
      <div class="guide" id="dialogGuide">🧙‍♂️</div>
      <button class="btn primary big block" id="dialogBtn" data-action="close-dialog"></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;text-align:center">Bitte aktiviere JavaScript, um Avalon zu nutzen.</p></noscript>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
